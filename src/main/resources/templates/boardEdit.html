<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>게시글 수정</title>
</head>
<body>

<h1>게시글 수정</h1>

<form th:action="@{/boards/update/{id}(id=${board.id})}" method="post">

    제목 :
    <input type="text" name="title" th:value="${board.title}">
    <br><br>

    작성자 :
    <input type="text" name="writer" th:value="${board.writer}">
    <br><br>

    내용 :
    <br>
    <textarea name="content" rows="5" cols="50"
              th:text="${board.content}"></textarea>
    <br><br>

    <button type="submit">수정하기</button>

</form>

</body>
</html>
